# Alert rules for the sample-app demo (make run-sample-app).
#
# Replace the webhook URL with your own Slack incoming webhook, then start
# the system of record with:
#
#   make run-sor ALERTS=alert.sample-app.conf
#
# Stream paths follow the CLI layout: /<namespace>/<service>/metrics/<name>.dat
# Histograms are split into <name>.count and <name>.sum streams.
#
# Two channel types. An incoming webhook posts a new message for every
# ALERT and RESOLVED. A bot token (chat:write scope) posts the ALERT and
# then edits that same message when it resolves, keeping both times:
#
#   channel ops slack-bot xoxb-your-bot-token C0123456789

channel ops slack https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX

# Press b in the sample app to start a 3 min burst: memory climbs to
# 512 MB within seconds, CPU pins above 0.9, and half the requests fail.
# Metrics export every 5 s, so these fire ~30 s into the burst and a
# "resolved" message follows once the burst ends and the heap GCs.

# Simulated heap climbs ~256 KB/request and resets randomly; a burst
# allocates ~96 KB/request at 10x traffic without any GC.
alert /iam/iam-api/metrics/go.memory.used.dat > 120000000 for 30s to ops

# CPU idles as a sine wave between ~0.1 and ~0.7, so only a burst trips this.
alert /iam/iam-api/metrics/process.cpu.utilization.dat >= 0.8 for 30s to ops

# Request and error counters export the count per 5 s interval (delta
# temporality). At 20 rps that is ~100 requests and ~2 errors per sample.
# Every minute or two the app blips for 5-20 s (25% errors, 5x traffic):
# ~25 errors and ~500 requests per sample, over threshold but too short
# for the 30 s hold, so amber only. A burst (50% errors, 10x traffic) holds
# for 3 minutes and fires.
alert /iam/iam-api/metrics/http.server.errors.dat > 10 for 30s to ops
alert /iam/iam-api/metrics/http.server.requests.dat > 400 for 30s to ops

# Sanity check that the app is alive: uptime should never go below 10s
# after the first minute. (Fires only if the SoR restarts and the app
# reports a fresh, small uptime for 1 minute.)
alert /iam/iam-api/metrics/process.uptime.dat < 10 for 1m to ops

# A second service, simulated by a sample app started with
# SAMPLE_CONF=sample-app.web.conf. Same shape, tighter error budget.
alert /iam/iam-web/metrics/go.memory.used.dat > 120000000 for 30s to ops
alert /iam/iam-web/metrics/process.cpu.utilization.dat >= 0.8 for 30s to ops
# iam-web runs at 8 rps: ~40 requests and ~1 error per sample, ~10 in a blip.
alert /iam/iam-web/metrics/http.server.errors.dat > 5 for 30s to ops

# Absence: fires when a stream stops arriving. Press p in the sample app to
# pause its gauges; CPU goes silent, this fires after 30 s, and it resolves
# on the next sample once you press p again.
alert /iam/iam-api/metrics/process.cpu.utilization.dat absent for 30s to ops
alert /iam/iam-web/metrics/process.cpu.utilization.dat absent for 30s to ops
