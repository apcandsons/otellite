# Services for the sample app to simulate, one per line:
#
#   service <namespace> <name> [rps=<requests per second>]
#
# Start with:  make run-sample-app SAMPLE_CONF=sample-app.web.conf
# Run sample-app.api.conf in a second terminal to fake iam/iam-api too.
# Every service exports the same metrics under /<namespace>/<name>/metrics/.
# rps defaults to the -rps flag (20).

service iam iam-web rps=8
