version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: internal/adapter/grpcapi/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/adapter/grpcapi/pb
    opt: paths=source_relative
  - local: webui/node_modules/.bin/protoc-gen-es
    out: webui/src/gen
    opt: target=ts
