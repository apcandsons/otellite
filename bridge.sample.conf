# bridge.conf for the comm staging estate. One AWS resource per line:
#
#   region <aws region>                      required
#   every  <duration>                        poll interval, default 60s
#   <kind> <id> as <namespace>/<service>/<prefix>
#
# kind is ecs (id = cluster/service), sqs (id = queue name) or rds
# (id = DB instance identifier). Every metric of the target lands in the
# SoR at /<namespace>/<service>/metrics/<prefix>.<name>.dat.

region ap-northeast-1
every 60s

# ECS service: <prefix>.running_tasks / desired_tasks / pending_tasks
# plus cpu.utilization and memory.utilization from CloudWatch.
ecs comm-staging/comm-bff as comm/comm-bff/ecs

# SQS queues: <prefix>.visible / in_flight / oldest_age (0 when idle).
sqs comm-staging-embed     as comm/queues/embed
sqs comm-staging-embed-dlq as comm/queues/embed_dlq
sqs comm-staging-push-dlq  as comm/queues/push_dlq

# RDS instance: <prefix>.cpu.utilization / free_storage / connections /
# freeable_memory.
rds comm-staging-db as comm/comm-sor/rds
